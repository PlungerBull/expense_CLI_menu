repos:
  # Local secret scanning (backlog 4.5) — the public-repo doctrine's
  # pre-commit line of defense; GitHub push protection stays as backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Runs the dev venv's mypy (language: system) so it sees the real installed
  # deps; scope comes from [tool.mypy] files in pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
