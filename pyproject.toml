[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-cli-menu"
version = "0.0.1"
description = "The Hands — expense_world_engine CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tzlocal>=5.2",
    "questionary>=2.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "openpyxl>=3.1",
]
import = [
    "openpyxl>=3.1",
]

[project.scripts]
expense = "expense.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
