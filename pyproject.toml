[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-cli-menu"
version = "0.0.1"
description = "The Hands — expense_world_engine CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tzlocal>=5.2",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "openpyxl>=3.1",
    "mypy>=1.14",
]
import = [
    "openpyxl>=3.1",
]

[project.scripts]
expense = "expense.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Permissive start, scoped to the plumbing that passes engine JSON around
# (backlog 4.2); widen the file list / tighten flags as modules get annotated.
[tool.mypy]
python_version = "3.11"
files = ["expense/http.py", "expense/config.py", "expense/errors.py", "expense/cache"]
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
