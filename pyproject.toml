[build-system]
# >=77 for PEP 639 SPDX license expressions.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-cli-menu"
version = "0.0.1"
description = "The Hands — expense_world_engine CLI."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tzlocal>=5.2",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "openpyxl>=3.1",
    "mypy>=1.14",
    "pytest-cov>=5",
]
import = [
    "openpyxl>=3.1",
]

[project.scripts]
expense = "expense.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Typer's whole API is `param: T = typer.Option(...)` in the signature — the calls
# are its declaration syntax, not mutable defaults. B008 auto-exempts plain-typed
# options but not Enum-typed ones, so allowlist them explicitly (Typer's documented
# ruff config) to keep the exemption uniform.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Permissive start, scoped to the plumbing that passes engine JSON around
# (backlog 4.2); widen the file list / tighten flags as modules get annotated.
[tool.mypy]
python_version = "3.11"
files = ["expense/http.py", "expense/config.py", "expense/errors.py", "expense/cache"]
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["expense"]
